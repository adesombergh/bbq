<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grill-ui</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint: `system` never reaches the CSS,
      // only a concrete data-theme does. Mirrors src/lib/theme.ts on purpose —
      // this has to run without the bundle.
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem("grill-ui:theme")
        } catch {
          // Storage can be blocked; system it is.
        }
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            !matchMedia("(prefers-color-scheme: light)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
